# Example study: hidden activation on two classification datasets, 3 seeds each.
# Paths are relative to the current working directory; run from the repo root:
#   cargo run --release --manifest-path src/compute/Cargo.toml -- generate data/experiments/classification/example-study
#   cargo run --release --manifest-path src/compute/Cargo.toml -- train data/experiments/classification/example-study
#   uv run --project src/analysis src/analysis/main.py aggregate data/experiments/classification/example-study

description = "Wpływ funkcji aktywacji w warstwach ukrytych na dwóch zbiorach klasyfikacyjnych."
seeds = [1, 2, 3]                  # every variant runs once per seed (training.seed)

# Full form: every level sets several keys, here the activation with its usual initialization.
[[axes]]
name = "activation"
levels = [
  { name = "sigmoid", set = { "model.hidden_activation" = { kind = "sigmoid" }, "model.init" = { kind = "xavier" } } },
  { name = "tanh", set = { "model.hidden_activation" = { kind = "tanh" }, "model.init" = { kind = "xavier" } } },
  { name = "relu", set = { "model.hidden_activation" = { kind = "relu" }, "model.init" = { kind = "he" } } },
]

[[axes]]
name = "dataset"
levels = [
  { name = "simple-100", set = { "data.train" = "data/datasets/classification/data.simple.train.100.csv", "data.test" = "data/datasets/classification/data.simple.test.100.csv" } },
  { name = "three-gauss-500", set = { "data.train" = "data/datasets/classification/data.three_gauss.train.500.csv", "data.test" = "data/datasets/classification/data.three_gauss.test.500.csv" } },
]

[report]                           # comparison plots: activations on the x axis, a panel per dataset
x = "activation"
panels = ["dataset"]

# Complete experiment config (see config.toml of example-three-gauss), without training.seed.
# Keys set by the axes still need a value here; it is replaced in every run.
[base]
task = "classification"

[base.data]
train = "data/datasets/classification/data.simple.train.100.csv"
test = "data/datasets/classification/data.simple.test.100.csv"
target = "cls"
input_normalization = "standard"
target_normalization = "none"
validation_fraction = 0.0

[base.model]
hidden_layers = [16, 16]
bias = true
hidden_activation = { kind = "tanh" }
output_activation = "softmax"
init = { kind = "xavier" }

[base.optimizer]
kind = "adam"
learning_rate = 0.01

[base.training]
loss = "cross_entropy"
epochs = 100
batch_size = 32

[base.logging]
loss_every = 1
weights_every = 50                 # fewer snapshots: many runs
max_weights_per_layer = 64

[base.output]
grid_resolution = 200
grid_margin = 0.1
