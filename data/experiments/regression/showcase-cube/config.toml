# Showcase experiment for the report: one training run on `cube` with all single-run plots.
# Same run as `runs/tanh__500/seed-1` of the study `cube-activations` (its base config,
# size 500, seed 1); only the weights are logged more often, which does not change training.
# Run from the repo root:
#   cargo run --release --manifest-path src/compute/Cargo.toml -- train data/experiments/regression/showcase-cube
#   uv run --project src/analysis src/analysis/main.py plot data/experiments/regression/showcase-cube

task = "regression"

[data]
train = "data/datasets/regression/data.cube.train.500.csv"
test = "data/datasets/regression/data.cube.test.500.csv"
target = "y"
input_normalization = "standard"
target_normalization = "standard"  # targets are in the hundreds
validation_fraction = 0.0

[model]
hidden_layers = [32, 32]
bias = true
hidden_activation = { kind = "tanh" }
output_activation = "identity"
init = { kind = "xavier" }

[optimizer]
kind = "adam"
learning_rate = 0.003

[training]
loss = "mse"
epochs = 300
batch_size = 32
seed = 1

[logging]
loss_every = 1
weights_every = 10                 # the studies use 100; denser snapshots give smooth trajectories
max_weights_per_layer = 32

[output]
grid_resolution = 500
grid_margin = 0.1
