# Study: optimizer and learning rate on a subset of MNIST, 5 seeds each.
# Fourth tuning study (earlier choices: min_max, 512, ReLU); compared on the validation set.
# Run from the repo root:
#   pwsh -File scripts/run-studies.ps1 -Jobs 8 data/experiments/mnist/tuning-optimizers

description = "Wpływ optymalizatora i współczynnika uczenia na klasyfikację MNIST: sieć 784-512-10 z ReLU, podzbiór 10000 obrazów uczących, wybór na zbiorze walidacyjnym."
seeds = [1, 2, 3, 4, 5]

# Every level replaces the whole [optimizer] table.
[[axes]]
name = "optimizer"
levels = [
  { name = "sgd-0.1", set = { "optimizer" = { kind = "sgd", learning_rate = 0.1 } } },
  { name = "momentum-0.01", set = { "optimizer" = { kind = "momentum", learning_rate = 0.01, momentum = 0.9 } } },
  { name = "adam-0.0003", set = { "optimizer" = { kind = "adam", learning_rate = 0.0003 } } },
  { name = "adam-0.001", set = { "optimizer" = { kind = "adam", learning_rate = 0.001 } } },
  { name = "adam-0.003", set = { "optimizer" = { kind = "adam", learning_rate = 0.003 } } },
]

[report]
x = "optimizer"
split = "validation"               # the test set is only for the final evaluation

[report.labels]
optimizer = "Optymalizator"
"sgd-0.1" = "SGD (0,1)"
"momentum-0.01" = "momentum (0,01)"
"adam-0.0003" = "Adam (0,0003)"
"adam-0.001" = "Adam (0,001)"
"adam-0.003" = "Adam (0,003)"

# Settings not studied here: the base of the tuning with the choices of the earlier studies.
[base]
task = "classification"

[base.data]
train = "data/datasets/mnist/data.mnist.train.60000.csv"
test = "data/datasets/mnist/data.mnist.test.10000.csv"
target = "label"
input_normalization = "min_max"    # tuning-normalization
target_normalization = "none"
train_subset = 10000
validation_fraction = 0.2

[base.model]
hidden_layers = [512]              # tuning-architectures
bias = true
hidden_activation = { kind = "relu" }  # tuning-activations
output_activation = "softmax"
init = { kind = "he" }

[base.optimizer]
kind = "adam"
learning_rate = 0.001

[base.training]
loss = "cross_entropy"
epochs = 30
batch_size = 32
early_stopping = { patience = 5 }

[base.logging]
loss_every = 1
weights_every = 250
max_weights_per_layer = 64

[base.output]
grid_resolution = 100
grid_margin = 0.1
