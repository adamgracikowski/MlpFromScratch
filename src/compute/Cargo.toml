[package]
name = "compute"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Compute layer of MlpFromScratch: trains a multilayer perceptron and writes training artifacts."

[lib]
name = "compute"
path = "src/lib.rs"

[[bin]]
name = "compute"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.21"

[profile.release]
debug = "line-tables-only"
